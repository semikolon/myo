[project]
name = "myo-bridge"
version = "0.1.0"
description = "Connects a Thalmic Myo armband to the Mac over Bluetooth LE: gestures in, buzzes out."
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
myo-bridge = "myo_bridge.bridge:main"
myo-buzz = "myo_bridge.buzz:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myo_bridge"]
